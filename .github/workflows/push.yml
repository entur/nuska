name: Build and push
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  maven-verify:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # setup-java's liberica distribution can't select 25.0.5.0.3+5 (it maps to the same
      # semver as 25.0.5.0.2+5), so download the exact eMudhra-fixed build and install it.
      - name: Download Liberica JDK 25.0.5.0.3+5
        run: |
          curl -fsSL -o "$RUNNER_TEMP/liberica.tar.gz" "https://github.com/bell-sw/Liberica/releases/download/25.0.5.0.3+5/bellsoft-jdk25.0.5.0.3+5-linux-amd64.tar.gz"
          echo "d6f798af1ace9d228e0fcae073ba87b600bc9c33  $RUNNER_TEMP/liberica.tar.gz" | sha1sum -c -
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/liberica.tar.gz
          java-version: 25.0.5
      - name: Cache Maven dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
            ${{ runner.os }}-
      - run: mvn verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: target/*.jar
      - name: Sonar Scan
        env:
          SONAR_TOKEN: ${{ secrets.ENTUR_SONAR_PASSWORD }}
          SONAR_PROJECT_NAME: ${{ github.event.repository.name }}
          SONAR_PROJECT_KEY: entur_${{ github.event.repository.name }}
        run: |
          mvn org.jacoco:jacoco-maven-plugin:prepare-agent verify \
                  org.jacoco:jacoco-maven-plugin:report sonar:sonar \
                  -Dmaven.main.skip \
                  -DskipTests \
                  -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
                  -Dsonar.organization=enturas-github \
                  -Dsonar.projectName=${SONAR_PROJECT_NAME} \
                  -Dsonar.host.url=https://sonarcloud.io \
                  -Dsonar.token=${SONAR_TOKEN}
  Openapi-lint:
    needs: [ maven-verify ]
    uses: entur/gha-api/.github/workflows/lint.yml@v6.11.0
    secrets: inherit
    with:
      path: 'src/main/resources/openapi/openapi.yaml'
      upload_to_bucket: ${{ github.repository_owner == 'entur' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  openapi-publish:
    if: github.repository_owner == 'entur' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ Openapi-lint ]
    uses: entur/gha-api/.github/workflows/publish.yml@v6.11.0
    secrets: inherit
    with:
      path: 'src/main/resources/openapi/openapi.yaml'
