deployment:
  name: nuska
service:
  http:
    externalPort: 8080
    internalPort: 8080

replicas: 2
rollingUpdate:
  maxSurge: 25%
  maxUnavailable: 25%

resources:
  memLimit: "1500Mi"
  cpuRequest: "2"
  memRequest: "1000Mi"
  xss: 512k
  xmx: 1000m

configMapMount:
  name: nuska-config

netex:
  # NeTEx variant served when the dsjcompatibility request parameter is omitted:
  # new (NeTEx 1.16), legacy (NeTEx 1.15) or default (variant selected by the import pipeline)
  dsjDefaultVariant: new

image:
  identifier: <+artifacts.primary.image>
  imagePullPolicy: Always
